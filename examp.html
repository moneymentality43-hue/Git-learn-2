<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
    }

    .login-box{
      width:350px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:20px;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
    }

    .input-box input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    .login-btn{
      width:100%;
      padding:10px;
      border:none;
      background:#007bff;
      color:white;
      font-size:16px;
      border-radius:5px;
      cursor:pointer;
    }

    .login-btn:hover{
      background:#0056b3;
    }

    .footer-text{
      text-align:center;
      margin-top:15px;
      font-size:14px;
    }

    .footer-text a{
      text-decoration:none;
      color:#007bff;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>

    <form>
      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="footer-text">
        Don't have an account?
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
